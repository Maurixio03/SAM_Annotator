<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Annotator — Iniciar sesión</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0f1520;--border:#1e2a3d;--border2:#253347;
  --accent:#3d7fff;--accent2:#2563d4;--text:#e8edf5;--muted:#6b7d9a;
  --green:#1db87a;--red:#e05252;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(61,127,255,.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 80%, rgba(29,184,122,.05) 0%, transparent 60%);
}

/* Card */
.card{
  width:100%;max-width:380px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:36px 32px 28px;
  box-shadow:0 24px 64px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.03) inset;
}

/* Logo */
.logo-wrap{text-align:center;margin-bottom:28px}
.logo-icon{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#1a2d50,#0d1f3a);
  border:1px solid var(--border2);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.logo-icon svg{width:28px;height:28px}
.logo-title{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--text)}
.logo-by{
  font-size:11px;color:var(--muted);margin-top:5px;
  font-style:italic;letter-spacing:.01em;
}

/* Form */
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase}
input{
  width:100%;padding:10px 13px;
  background:#0a1020;border:1px solid var(--border2);
  border-radius:9px;color:var(--text);font-size:13px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,127,255,.12);}
input::placeholder{color:#3a4a62}

.btn-login{
  width:100%;padding:11px;margin-top:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:9px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:filter .15s,transform .1s;
  letter-spacing:.02em;
}
.btn-login:hover{filter:brightness(1.1)}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;filter:none}

/* Error */
.error-msg{
  background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.25);
  color:#f08080;border-radius:7px;padding:8px 12px;
  font-size:12px;margin-top:12px;display:none;text-align:center;
}
.error-msg.show{display:block}

/* Footer */
.footer{
  margin-top:20px;text-align:center;
  font-size:11px;color:var(--muted);
}
.footer a{color:var(--muted);text-decoration:none;transition:color .15s}
.footer a:hover{color:var(--text)}

/* Contact button */
.contact-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:6px;
  border:1px solid var(--border2);background:transparent;
  color:var(--muted);font-size:11px;cursor:pointer;
  transition:all .15s;margin-top:10px;
}
.contact-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(61,127,255,.06)}

/* Modal de contacto */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);z-index:100;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:28px 26px;width:340px;max-width:95vw;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-title{font-size:15px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.contact-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:9px;
  border:1px solid var(--border);margin-bottom:10px;
  text-decoration:none;color:var(--text);
  transition:border-color .15s,background .15s;
}
.contact-item:hover{border-color:var(--accent);background:rgba(61,127,255,.06)}
.contact-item:last-child{margin-bottom:0}
.contact-icon{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:16px;
}
.contact-icon.mail{background:rgba(61,127,255,.15)}
.contact-icon.linkedin{background:rgba(10,102,194,.2)}
.contact-label{font-size:11px;color:var(--muted);margin-bottom:1px}
.contact-value{font-size:12px;font-weight:500}
.modal-close{
  width:100%;margin-top:16px;padding:8px;
  background:transparent;border:1px solid var(--border2);
  border-radius:8px;color:var(--muted);font-size:12px;
  cursor:pointer;transition:all .15s;
}
.modal-close:hover{border-color:var(--border);color:var(--text)}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="11" stroke="#3d7fff" stroke-width="1.5"/>
        <circle cx="14" cy="14" r="4" fill="#3d7fff"/>
        <circle cx="14" cy="4"  r="1.5" fill="#3d7fff" opacity=".5"/>
        <circle cx="14" cy="24" r="1.5" fill="#3d7fff" opacity=".5"/>
        <circle cx="4"  cy="14" r="1.5" fill="#3d7fff" opacity=".5"/>
        <circle cx="24" cy="14" r="1.5" fill="#3d7fff" opacity=".5"/>
      </svg>
    </div>
    <div class="logo-title">SAM Annotator</div>
    <div class="logo-by">By A. Mauricio Devia Santoya</div>
  </div>

  <div class="field">
    <label>Usuario</label>
    <input type="text" id="inp-user" placeholder="usuario" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btn-login">Iniciar sesión</button>
  <div class="error-msg" id="err-msg"></div>

  <div class="footer">
    <button class="contact-btn" onclick="document.getElementById('modal-contact').classList.add('open')">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 110 2 1 1 0 010-2zm0 3.5c.55 0 1 .45 1 1V11a1 1 0 01-2 0V8.5c0-.55.45-1 1-1z" fill="currentColor"/></svg>
      Contacto
    </button>
  </div>
</div>

<!-- Modal de contacto -->
<div class="modal-overlay" id="modal-contact">
  <div class="modal">
    <div class="modal-title">Contacto del desarrollador</div>
    <div class="modal-sub">A. Mauricio Devia Santoya</div>

    <a class="contact-item" href="mailto:devia2001@outlook.com">
      <div class="contact-icon mail">✉️</div>
      <div>
        <div class="contact-label">Correo electrónico</div>
        <div class="contact-value">devia2001@outlook.com</div>
      </div>
    </a>

    <a class="contact-item" href="https://www.linkedin.com/in/a-mauricio-devia-santoya-724773318/" target="_blank" rel="noopener">
      <div class="contact-icon linkedin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a66c2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </div>
      <div>
        <div class="contact-label">LinkedIn</div>
        <div class="contact-value">A. Mauricio Devia Santoya</div>
      </div>
    </a>

    <button class="modal-close" onclick="document.getElementById('modal-contact').classList.remove('open')">
      Cerrar
    </button>
  </div>
</div>

<script>
async function doLogin(){
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const btn  = document.getElementById('btn-login');
  const err  = document.getElementById('err-msg');
  if(!user||!pass){showErr('Completa usuario y contraseña');return;}
  btn.disabled=true; btn.textContent='Verificando...';
  try{
    const r = await fetch('/api/auth/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass})
    });
    const d = await r.json();
    if(d.ok){ location.href='/'; }
    else{ showErr(d.error||'Credenciales incorrectas'); }
  }catch(e){ showErr('Error de conexión'); }
  btn.disabled=false; btn.textContent='Iniciar sesión';
}

function showErr(msg){
  const el=document.getElementById('err-msg');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4000);
}

document.getElementById('btn-login').addEventListener('click',doLogin);
document.getElementById('inp-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('inp-user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inp-pass').focus();});

// Cerrar modal con Escape
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('modal-contact').classList.remove('open');
});
document.getElementById('modal-contact').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('open');
});
</script>
</body>
</html>
